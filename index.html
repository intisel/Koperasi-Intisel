<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Koperasi Intisel - Validasi Anggota</title><link rel="manifest" href="manifest.json"><script src="anggota.js"></script><style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f4faf7} .header{background:#0e7a5e;color:#fff;padding:16px 20px;position:sticky;top:0} .hero{background:linear-gradient(180deg,#0e7a5e,#14a07e);color:#fff;padding:24px 20px;text-align:center} .card{background:#fff;border-radius:16px;padding:18px;margin:14px;box-shadow:0 4px 18px rgba(0,0,0,.06)} .btn{width:100%;padding:14px;border-radius:12px;border:none;background:#0e7a5e;color:#fff;font-weight:700} .btn2{width:100%;padding:12px;border-radius:12px;background:#fff;color:#0e7a5e;border:2px solid #0e7a5e;margin-top:10px} input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1.5px solid #cfe5dc;margin:6px 0 12px} .ok{background:#e7f3ef;border:1px solid #0e7a5e;padding:10px;border-radius:10px;color:#0e7a5e} .err{background:#fdecea;border:1px solid #e74c3c;padding:10px;border-radius:10px;color:#c0392b} .small{font-size:12px;color:#6b8a7f}</style></head><body>
<div class="header"><b>KOPERASI INTISEL</b> - Validasi Anggota</div>
<div class="hero"><h3 style="margin:0">Pinjaman Hanya Untuk Anggota Terdaftar</h3><p class="small" style="color:#fff">Maks 5 Juta - Tanpa Bunga - Akad Qardh</p></div>

<div class="card">
<b>1. Cek Keanggotaan (NIK)</b>
<input id="nikInput" placeholder="Masukkan NIK (contoh: 91207191)" oninput="cekNIK()">
<div id="hasilCek"></div>
</div>

<div class="card" id="formPinjam" style="display:none">
<b>2. Form Pinjaman - <span id="namaAnggota"></span></b>
<p class="small">Jabatan: <span id="jabAnggota"></span> | Base: <span id="baseAnggota"></span></p>
<input type="range" id="nom" min="500000" max="5000000" step="100000" value="2000000" oninput="hitung()"><div style="display:flex;justify-content:space-between;font-weight:700"><span id="nomTxt">Rp 2.000.000</span><span>0% BUNGA</span></div>
<select id="tenor" onchange="hitung()"><option value="3">3 Bulan</option><option value="6">6 Bulan</option><option value="10" selected>10 Bulan</option><option value="12">12 Bulan</option></select>
<div class="ok" style="margin-top:10px"><div style="display:flex;justify-content:space-between"><span>Angsuran</span><b id="ang">Rp 200.000</b></div><div style="display:flex;justify-content:space-between"><span>Total</span><b id="tot">Rp 2.000.000</b></div></div>
<textarea id="tujuan" placeholder="Alasan peminjaman"></textarea>
<button class="btn" onclick="ajukan()">Ajukan Pinjaman</button>
<button class="btn2" onclick="notif()">🔔 Aktifkan Notifikasi</button>
<button class="btn2" id="inst" style="display:none">📲 Install Aplikasi</button>
</div>

<script>
let pmt, anggotaAktif=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pmt=e;document.getElementById('inst').style.display='block'});
function rp(n){return 'Rp '+n.toLocaleString('id-ID')}
function cekNIK(){
  let nik=document.getElementById('nikInput').value.trim();
  let hasil=document.getElementById('hasilCek');
  let form=document.getElementById('formPinjam');
  if(nik.length<4){hasil.innerHTML='';form.style.display='none';return}
  let found=ANGGOTA.find(a=>a.nik===nik || a.nama.toLowerCase().includes(nik.toLowerCase()));
  if(found){
    anggotaAktif=found;
    hasil.innerHTML=`<div class="ok">✅ Anggota Ditemukan: <b>${found.nama}</b> - ${found.jabatan}</div>`;
    document.getElementById('namaAnggota').innerText=found.nama;
    document.getElementById('jabAnggota').innerText=found.jabatan;
    document.getElementById('baseAnggota').innerText=found.base;
    form.style.display='block';
  }else{
    anggotaAktif=null;
    hasil.innerHTML=`<div class="err">❌ NIK/Nama tidak ditemukan di daftar 118 anggota. Hanya anggota yang boleh meminjam.</div>`;
    form.style.display='none';
  }
}
function hitung(){let a=+document.getElementById('nom').value,t=+document.getElementById('tenor').value;document.getElementById('nomTxt').innerText=rp(a);document.getElementById('ang').innerText=rp(Math.round(a/t));document.getElementById('tot').innerText=rp(a)}hitung();
function ajukan(){
  if(!anggotaAktif){alert('Cek NIK dulu');return}
  let tujuan=document.getElementById('tujuan').value;
  // Simpan ke localStorage sebagai database sementara
  let data=JSON.parse(localStorage.getItem('pinjaman')||'[]');
  data.push({nik:anggotaAktif.nik,nama:anggotaAktif.nama,nominal:document.getElementById('nom').value,tenor:document.getElementById('tenor').value,tujuan:tujuan,waktu:new Date().toLocaleString()});
  localStorage.setItem('pinjaman',JSON.stringify(data));
  if(Notification&&Notification.permission=='granted')new Notification('Koperasi Intisel',{body:`Pengajuan ${anggotaAktif.nama} diproses`});
  alert(`Berhasil! Pengajuan ${anggotaAktif.nama} - ${document.getElementById('nomTxt').innerText} disimpan di database lokal.`);
  // Nanti ganti ini dengan kirim ke Google Sheet / Firebase
}
function notif(){Notification.requestPermission().then(r=>{if(r=='granted'){alert('Notifikasi aktif');navigator.serviceWorker.register('sw.js')}})}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')
</script>
</body></html>
