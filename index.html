<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koperasi Intisel - Pinjaman Anggota</title>
<script src="anggota.js"></script>
<style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f4faf7}
.header{background:#0e7a5e;color:#fff;padding:16px;text-align:center;font-weight:800}
.card{background:#fff;border-radius:16px;padding:18px;margin:14px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.btn{width:100%;padding:14px;border-radius:12px;border:none;background:#0e7a5e;color:#fff;font-weight:700;font-size:16px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1.5px solid #cfe5dc;margin:6px 0 12px}
.ok{background:#e7f3ef;border:1px solid #0e7a5e;padding:10px;border-radius:10px;color:#0e7a5e}
.err{background:#fdecea;border:1px solid #e74c3c;padding:10px;border-radius:10px;color:#c0392b}
.small{font-size:12px;color:#6b8a7f}</style></head><body>
<div class="header">KOPERASI INTISEL LAMPUNG SYARIAH<br><span class="small" style="color:#fff">Pinjaman Khusus 118 Anggota Terdaftar - Tanpa Bunga</span></div>

<div class="card">
<b>1. Cek NIK Anggota</b>
<input id="nikInput" placeholder="Masukkan NIK / Nama (contoh: 91207191 atau Sobri)" oninput="cekNIK()">
<div id="hasilCek"></div>
</div>

<div class="card" id="formPinjam" style="display:none">
<b>2. Form Pengajuan - <span id="namaAnggota"></span></b>
<p class="small">Jabatan: <span id="jabAnggota"></span> | NIK: <span id="nikAnggota"></span></p>
<label>Nominal Pinjaman (Maks 5 Juta)</label>
<input type="range" id="nom" min="500000" max="5000000" step="100000" value="2000000" oninput="hitung()">
<div style="display:flex;justify-content:space-between;font-weight:700"><span id="nomTxt">Rp 2.000.000</span><span>0% BUNGA - Qardh</span></div>
<label>Tenor</label>
<select id="tenor" onchange="hitung()"><option value="3">3 Bulan</option><option value="6">6 Bulan</option><option value="10" selected>10 Bulan</option><option value="12">12 Bulan</option></select>
<div class="ok"><span>Angsuran: </span><b id="ang">Rp 200.000</b> x <span id="tenorTxt">10</span> bulan | Total: <b id="tot">Rp 2.000.000</b></div>
<textarea id="tujuan" placeholder="Alasan peminjaman..."></textarea>
<input id="wa" placeholder="No WA aktif">
<button class="btn" id="btnAjukan" onclick="kirimKeDatabase()">Kirim Pengajuan ke Koperasi</button>
<p class="small" id="statusKirim"></p>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwGQyFRrt52M2MCjt1deeiVroVgZuUBgJLdIv2qrOF3YQfwv9M4k697Tg_4JkAQVjaV/exec";
let anggotaAktif=null;
function rp(n){return 'Rp '+n.toLocaleString('id-ID')}
function cekNIK(){
  let nik=document.getElementById('nikInput').value.trim();
  let hasil=document.getElementById('hasilCek');
  let form=document.getElementById('formPinjam');
  if(nik.length<3){hasil.innerHTML='';form.style.display='none';return}
  let found=ANGGOTA.find(a=>a.nik===nik || a.nama.toLowerCase().includes(nik.toLowerCase()));
  if(found){
    anggotaAktif=found;
    hasil.innerHTML=`<div class="ok">✅ Anggota Ditemukan: <b>${found.nama}</b> - ${found.jabatan}</div>`;
    document.getElementById('namaAnggota').innerText=found.nama;
    document.getElementById('jabAnggota').innerText=found.jabatan;
    document.getElementById('nikAnggota').innerText=found.nik||'-';
    form.style.display='block';
  }else{
    anggotaAktif=null;
    hasil.innerHTML=`<div class="err">❌ NIK/Nama tidak ada di daftar 118 anggota. Hubungi HRD.</div>`;
    form.style.display='none';
  }
}
function hitung(){let a=+document.getElementById('nom').value,t=+document.getElementById('tenor').value;document.getElementById('nomTxt').innerText=rp(a);document.getElementById('ang').innerText=rp(Math.round(a/t));document.getElementById('tot').innerText=rp(a);document.getElementById('tenorTxt').innerText=t}hitung();

async function kirimKeDatabase(){
  if(!anggotaAktif){alert('Cek NIK dulu');return}
  let tujuan=document.getElementById('tujuan').value;
  let wa=document.getElementById('wa').value;
  if(!tujuan||!wa){alert('Isi alasan dan WA');return}
  document.getElementById('btnAjukan').innerText='Mengirim...';
  document.getElementById('statusKirim').innerText='Menghubungkan ke database Koperasi...';
  try{
    let res=await fetch(API_URL,{
      method:"POST",
      mode:"no-cors", // untuk Google Apps Script
      body: JSON.stringify({
        nik: anggotaAktif.nik,
        nama: anggotaAktif.nama,
        nominal: document.getElementById('nom').value,
        tenor: document.getElementById('tenor').value,
        tujuan: tujuan,
        wa: wa
      })
    });
    // Karena no-cors, kita anggap sukses dan cek di Sheet
    document.getElementById('statusKirim').innerHTML='<span style="color:green">✅ Pengajuan terkirim! Cek Google Sheet kamu. Admin Koperasi akan menerima email notifikasi.</span>';
    document.getElementById('btnAjukan').innerText='Berhasil Dikirim';
    alert('Berhasil! Pengajuan '+anggotaAktif.nama+' Rp '+document.getElementById('nom').value+' sudah masuk ke Google Sheet Form Responses 1 dan email koperasi.intisel@gmail.com');
  }catch(e){
    document.getElementById('statusKirim').innerText='Error: '+e;
    document.getElementById('btnAjukan').innerText='Coba Lagi';
  }
}
</script>
</body></html>
